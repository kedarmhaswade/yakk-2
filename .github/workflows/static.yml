name: Quarto Publish

on:
  push:
    branches: [ "main" ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install Python (3.12 is fine)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ⬅️ ADD THIS STEP
      - name: Install Jupyter
        run: pip install jupyter

      # Install Quarto (action provided by Quarto team)
      - uses: quarto-dev/quarto-actions/setup@v2

      # Render the blog
      - name: Render site
        run: quarto render blog/

      # Publish to GitHub Pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: blog/_site

  deploy:
    runs-on: ubuntu-latest
    needs: build-deploy
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

