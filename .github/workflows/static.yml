name: Build and Publish Notebook Blog

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install jupyter ipykernel nbformat

      - name: Clean previous site
        run: rm -rf blog/ || true

      - name: Build/generate site
        run: |
          # your build script must write files into ./blog
          python3 build_script.py || true

      - name: Debug: show any symlinks before sanitizing
        run: |
          echo "Symlinks (if any) under ./blog:"
          find blog -type l -print || true

      - name: Verify generated site (fail if empty)
        run: |
          echo "Contents of blog/"
          if [ -d blog ] && [ "$(ls -A blog 2>/dev/null)" ]; then
            ls -la blog
          else
            echo "::error::No files found in ./blog — upload will fail"
            ls -la || true
            exit 1
          fi

      - name: Sanitize site (dereference symlinks, avoid hardlinks)
        run: |
          SANITIZED=blog_sanitized
          rm -rf "$SANITIZED"
          mkdir -p "$SANITIZED"
          # rsync -aL will copy and dereference symlinks (copies target contents)
          rsync -aL --delete blog/ "$SANITIZED"/
          # remove any .git dirs etc that shouldn't be published
          find "$SANITIZED" -name ".git" -type d -exec rm -rf {} + || true
          echo "Sanitized copy created at $SANITIZED"
          echo "Any symlinks remaining (should be none):"
          find "$SANITIZED" -type l -print || true
          echo "Top level listing:"
          ls -la "$SANITIZED" || true

      - name: Sanity: check for hardlinks in sanitized tree (best-effort)
        shell: bash
        run: |
          SAN=blog_sanitized
          echo "Checking for files with link count > 1 (hardlinks):"
          # list files with >1 link count
          find "$SAN" -type f -printf '%n %p\n' 2>/dev/null | awk '$1>1 {print $0}' || true

      - name: Check size of artifact
        run: |
          du -sh blog_sanitized || true
          echo "Largest files under sanitized tree (top 20):"
          (find blog_sanitized -type f -exec du -h {} + | sort -hr | head -n 20) || true

      - name: Upload GitHub Pages artifact (sanitized)
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: blog_sanitized

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4
