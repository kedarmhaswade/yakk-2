name: Build and Publish Notebook Blog

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install jupyter ipykernel nbformat

      - name: Clean previous site
        run: rm -rf blog/ blog_sanitized/ || true

      - name: Build/generate site
        run: |
          # this must create files under ./blog
          python3 build_script.py || true

      - name: Debug list symlinks before sanitizing
        run: |
          echo "Symlinks (if any) under ./blog:"
          find blog -type l -print || true

      - name: Verify generated site (fail if empty)
        run: |
          if [ -d blog ] && [ "$(ls -A blog 2>/dev/null)" ]; then
            echo "Found files in ./blog"; ls -la blog
          else
            echo "::error::No files found in ./blog — upload will fail"
            exit 1
          fi

      - name: Sanitize site (dereference symlinks)
        run: |
          SAN=blog_sanitized
          rm -rf "$SAN"
          mkdir -p "$SAN"
          # rsync -aL dereferences symlinks and copies file contents
          rsync -aL --delete blog/ "$SAN"/
          # remove .git, checkpoints and OS trash
          find "$SAN" -name ".git" -type d -exec rm -rf {} + || true
          find "$SAN" -name ".ipynb_checkpoints" -type d -exec rm -rf {} + || true
          find "$SAN" -name ".DS_Store" -delete || true
          echo "Sanitized copy created at $SAN"
          echo "Symlinks remaining in sanitized tree (should be none):"
          find "$SAN" -type l -print || true
          echo "Top-level sanitized listing:"; ls -la "$SAN" || true

      - name: Check artifact size / large files
        run: |
          du -sh blog_sanitized || true
          (find blog_sanitized -type f -exec du -h {} + | sort -hr | head -n 20) || true

      - name: Upload GitHub Pages artifact (sanitized)
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: blog_sanitized

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4
