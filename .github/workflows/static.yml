name: Build and Publish Blog (Quarto)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Python (for Jupyter engine)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install Jupyter + ipykernel (required for Quarto Python execution)
      - name: Install Jupyter and Kernel
        run: |
          pip install jupyter ipykernel
          python -m ipykernel install --user --name python3

      # 4. Install Quarto CLI
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 5. Render only the `blog/` folder
      - name: Render Quarto Site
        run: quarto render blog/

      # 6. Upload the rendered `_site` folder to Pages
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blog/_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4

