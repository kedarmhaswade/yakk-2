name: Build and Publish Notebook Blog

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install jupyter ipykernel nbformat

      - name: Clean previous site
        run: rm -rf blog/ || true

      - name: Build/generate site
        run: |
          # run your build script which must write files into ./blog
          python3 build_script.py || true

      - name: Verify generated site (fail if empty)
        run: |
          echo "Checking ./blog content"
          if [ -d blog ] && [ "$(ls -A blog 2>/dev/null)" ]; then
            ls -la blog
          else
            echo "::error::No files found in ./blog — upload will fail"
            ls -la || true
            exit 1
          fi

      - name: Remove symlinks (avoid Pages artifact rejection)
        run: |
          echo "Removing symlinks under ./blog (if any)"
          find blog -type l -print -delete || true

      - name: Cleanup common temp files
        run: |
          find blog -name ".DS_Store" -delete || true
          find blog -name ".ipynb_checkpoints" -type d -exec rm -rf {} + || true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ./blog

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4
