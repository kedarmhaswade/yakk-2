name: Build and Publish Notebook Blog (Quarto, Notebook-first)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install jupyter ipykernel nbformat
          python -m ipykernel install --user --name python3

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Clean previous site
        run: rm -rf blog/_site/*

      # 🔹 Normalize notebooks to add missing cell IDs
      - name: Normalize notebooks
        run: |
          python - <<EOF
          from pathlib import Path
          import nbformat
	  from nbformat.validator import normalize
	  from pathlib import Path
          for nb_path in Path("blog").glob("*.ipynb"):
              nb = nbformat.read(nb_path, as_version=nbformat.NO_CONVERT)
              nbformat.normalize(nb)  # adds missing id fields
              nbformat.write(nb, nb_path)
          EOF

      # Render notebooks + index.qmd
      - name: Render Quarto Site
        run: quarto render blog/ --execute

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blog/_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4

