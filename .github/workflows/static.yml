name: Build and Publish Notebook Blog

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python deps for notebooks
        run: |
          python -m pip install --upgrade pip
          pip install jupyter ipykernel nbformat

      - name: Clean previous site
        run: rm -rf blog/ || true

      - name: Generate site (run build script)
        run: |
          # If you already keep ./blog in the repo skip or ensure this doesn't remove it
          python3 build_script.py || true

      - name: Verify generated site (fail if empty)
        run: |
          echo "Checking ./blog content"
          if [ -d blog ] && [ "$(ls -A blog 2>/dev/null)" ]; then
            ls -la blog
          else
            echo "::error::No files found in ./blog — upload will fail"
            ls -la || true
            exit 1
          fi

      - name: Remove symlinks under ./blog (required for Pages artifact)
        run: |
          echo "Removing symlinks under ./blog (if any)"
          find blog -type l -print -delete || true

      - name: Remove common temp/checkpoint files
        run: |
          find blog -name ".DS_Store" -delete || true
          find blog -name ".ipynb_checkpoints" -type d -exec rm -rf {} + || true
          # remove any .git dir inside blog (not required but safe)
          find blog -name ".git" -type d -exec rm -rf {} + || true

      - name: Show large files (informational)
        run: |
          echo "Largest files under ./blog (top 20):"
          (find blog -type f -exec du -h {} + | sort -hr | head -n 20) || true

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./blog
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          keep_files: false
