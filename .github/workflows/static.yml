name: Build and Publish Notebook Blog (Quarto)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install Jupyter + ipykernel
      - name: Install Jupyter and Kernel
        run: |
          pip install jupyter ipykernel
          python -m ipykernel install --user --name python3

      # 4. Install Quarto CLI
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 5. Clean previous site (optional but recommended)
      - name: Clean previous site
        run: rm -rf blog/_site/*

      # 6. Render Quarto site with executed notebooks
      - name: Render Quarto Site
        run: quarto render blog/ --execute --kernel python3

      # 7. Upload rendered _site/ for GitHub Pages
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blog/_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4

