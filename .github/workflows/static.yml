name: Build and Publish Notebook Blog

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps for notebooks
        run: |
          pip install jupyter ipykernel nbformat
          python -m ipykernel install --user --name python3

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Clean previous site
        run: rm -rf blog/_site || true

      # ---------------------------------------------------
      # 📌 Normalize all notebooks in "blog/"
      # ---------------------------------------------------
      - name: Normalize notebooks
        run: |
          python3 - <<'PY'
          import nbformat
          from nbformat.validator import normalize
          from pathlib import Path

          blog_dir = Path("blog")
          for nb_path in blog_dir.glob("*.ipynb"):
              nb = nbformat.read(nb_path, as_version=4)
              normalize(nb)
              nbformat.write(nb, nb_path)
              print("Normalized:", nb_path)
          PY

      # ---------------------------------------------------
      # 📌 Render blog site (executes notebooks)
      # ---------------------------------------------------
      - name: Render Quarto Site
        run: quarto render blog/ --execute

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blog/_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4

