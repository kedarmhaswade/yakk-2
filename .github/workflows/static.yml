name: Build and Publish Notebook Blog

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python deps for notebooks
        run: |
          python -m pip install --upgrade pip
          pip install jupyter ipykernel nbformat

      - name: Clean previous site
        run: rm -rf blog/ || true

      - name: Generate site (if needed)
        run: |
          # If you already have ./blog in the repo, remove this step or ensure it doesn't overwrite
          python3 build_script.py || true

      - name: Verify generated site (fail if empty)
        run: |
          echo "Contents of blog/"
          if [ -d blog ] && [ "$(ls -A blog)" ]; then
            ls -la blog
          else
            echo "::error::No files found in ./blog — upload will fail"
            ls -la || true
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ./blog

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4
