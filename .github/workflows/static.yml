name: Build and Publish Notebook Blog

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python deps for notebooks
        run: |
          pip install jupyter ipykernel nbformat
          python -m ipykernel install --user --name python3

      - name: Clean previous site
        run: rm -rf blog/ || true

      # ---------------------------------------------------
      # 📌 Convert all blog notebooks in "blog/"
      # ---------------------------------------------------
      - name: Normalize notebooks
        run: |
          python3 build_script.py

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4
